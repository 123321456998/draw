<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>现场汇报顺序抽签</title>
<style>
:root{
  --bgA:#fbf7ef; --bgB:#edf4f8; --ink:#173958; --muted:#74889a; --line:#d8e2e9;
  --btn:#173958; --btnHover:#244d70; --poolRing:#adc4d3; --poolGlow:#e2edf3;
  --ball1:#b8cfe2; --ball2:#e5ca8a; --ball3:#afd0bf; --ball4:#e2b0a6; --ball5:#ccbadd; --ball6:#aebbd3;
}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#dfe5e8;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;color:var(--ink)}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.design{position:absolute;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;background:radial-gradient(circle at 8% 12%,rgba(212,170,89,.13),transparent 24%),radial-gradient(circle at 92% 11%,rgba(158,190,214,.15),transparent 27%),linear-gradient(115deg,var(--bgA) 0%,#f8f8f6 48%,var(--bgB) 100%)}
.topbar{position:absolute;left:64px;right:64px;top:38px;height:58px;display:flex;align-items:center;justify-content:space-between}
.brand{height:54px;display:flex;align-items:center;gap:12px;padding:0 22px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(38,60,78,.07);font-size:18px;font-weight:900;letter-spacing:.5px}.live-dot{width:11px;height:11px;border-radius:50%;background:#ef5c50;box-shadow:0 0 0 5px rgba(239,92,80,.08)}
.status-pill{height:54px;display:flex;align-items:center;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.90);box-shadow:0 8px 24px rgba(38,60,78,.06);padding:0 22px;color:var(--muted);font-size:17px;font-weight:850}
.hero{position:absolute;left:50%;top:118px;width:1220px;transform:translateX(-50%);text-align:center}.hero h1{margin:0;font-size:66px;line-height:1.08;font-weight:950;letter-spacing:-2px}.hero p{margin:16px 0 0;color:var(--muted);font-size:25px;line-height:1.4;font-weight:760}
.pool-wrap{position:absolute;left:50%;top:290px;width:500px;height:500px;transform:translateX(-50%);transition:opacity .28s ease,transform .34s ease}.pool{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:9px solid rgba(255,255,255,.82);outline:3px solid var(--poolRing);background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.98),rgba(255,255,255,.30) 29%,transparent 30%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.80) 0 56%,rgba(255,255,255,.46) 79%,rgba(255,255,255,.20) 100%);box-shadow:inset 0 0 0 6px rgba(255,255,255,.54),inset 0 0 48px var(--poolGlow),0 24px 58px rgba(31,55,74,.11)}
.pool-center{position:absolute;left:50%;top:50%;width:128px;height:128px;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed rgba(23,57,88,.24);background:rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center;text-align:center;color:#8193a1;font-size:18px;line-height:1.45;font-weight:900;pointer-events:none}
.ball{position:absolute;width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#173958;font-size:22px;font-weight:950;border:3px solid rgba(255,255,255,.92);box-shadow:inset -10px -11px 20px rgba(45,65,81,.13),inset 9px 9px 20px rgba(255,255,255,.64),0 12px 24px rgba(34,57,76,.13);user-select:none;will-change:left,top,transform}.ball::before{content:"";position:absolute;left:19px;top:13px;width:20px;height:13px;border-radius:50%;background:rgba(255,255,255,.67);transform:rotate(-26deg)}.ball[data-i="0"]{background:var(--ball1)}.ball[data-i="1"]{background:var(--ball2)}.ball[data-i="2"]{background:var(--ball3)}.ball[data-i="3"]{background:var(--ball4)}.ball[data-i="4"]{background:var(--ball5)}.ball[data-i="5"]{background:var(--ball6)}
.control-area{position:absolute;left:50%;top:824px;width:520px;transform:translateX(-50%);text-align:center;transition:opacity .28s ease}.main-btn{width:430px;height:72px;border-radius:20px;border:0;cursor:pointer;font-weight:950;transition:.18s ease;background:var(--btn);color:#fff;box-shadow:0 13px 30px rgba(23,57,88,.20);font-size:26px}.main-btn:hover{transform:translateY(-2px);background:var(--btnHover)}.main-btn.ready{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 13px 30px rgba(23,57,88,.18)}50%{box-shadow:0 15px 34px rgba(23,57,88,.30),0 0 0 7px rgba(23,57,88,.05)}}.hint{margin-top:16px;color:var(--muted);font-size:17px;line-height:1.45;font-weight:720;white-space:nowrap}
.footer{position:absolute;left:64px;right:64px;bottom:28px;height:32px;display:flex;align-items:center;justify-content:space-between;color:#8d9aa5;font-size:14px;font-weight:720}.reset-btn{padding:7px 13px;border:1px dashed #aebac4;border-radius:10px;background:transparent;color:#8795a1;font-size:14px;font-weight:850;cursor:pointer}
.result-panel{position:absolute;left:50%;top:300px;width:1020px;transform:translateX(-50%) translateY(16px) scale(.99);opacity:0;pointer-events:none;transition:.38s ease}.result-panel.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}.result-card{width:100%;padding:32px 36px 30px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.93);box-shadow:0 24px 62px rgba(31,55,74,.12)}.result-head{text-align:center;margin-bottom:24px}.result-head h2{margin:0;font-size:42px;font-weight:950}.result-head p{margin:8px 0 0;color:var(--muted);font-size:19px;font-weight:720}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}.rank{min-height:76px;display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.98);opacity:0;transform:translateY(12px)}.rank.in{animation:rankIn .42s ease forwards}@keyframes rankIn{to{opacity:1;transform:none}}.rank-no{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;background:var(--ink);font-size:17px;font-weight:950}.rank-ball{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);border:2px solid rgba(255,255,255,.92);font-size:13px;font-weight:950}.rank-name{font-size:25px;font-weight:950}.lock{width:max-content;margin:22px auto 0;padding:10px 17px;border-radius:999px;background:#edf5ef;border:1px solid #d7e7dc;color:#557363;font-size:15px;font-weight:900}
</style>
</head>
<body>
<div class="viewport"><div class="design" id="design">
<header class="topbar"><div class="brand"><span class="live-dot"></span><span>LIVE DRAW · 现场抽签</span></div><div class="status-pill" id="status">6支参赛队伍｜完整排序</div></header>
<section class="hero"><h1>现场汇报顺序抽签</h1><p>点击开始后 6 支队伍同时滚动，再次点击即可停止并生成完整顺序</p></section>
<section class="pool-wrap" id="poolWrap"><div class="pool" id="pool"><div class="pool-center">随机打乱<br>全部队伍</div><div class="ball" data-i="0">A队</div><div class="ball" data-i="1">B队</div><div class="ball" data-i="2">C队</div><div class="ball" data-i="3">D队</div><div class="ball" data-i="4">E队</div><div class="ball" data-i="5">F队</div></div></section>
<section class="control-area" id="controlArea"><button class="main-btn ready" id="mainBtn">🎲 开始抽签</button><div class="hint" id="hint">点击“开始抽签”后六个队伍球同时滚动；再次点击即停止并生成 1—6 名完整顺序</div></section>
<section class="result-panel" id="resultPanel"><div class="result-card"><div class="result-head"><h2>抽签完成 ★</h2><p>请各参赛队伍按照以下顺序进行汇报</p></div><div class="result-grid" id="resultGrid"></div><div class="lock">🔒 本次抽签结果已锁定</div></div></section>
<footer class="footer"><span>可换肤底版｜后续可直接与大赛PPT统一视觉</span><button class="reset-btn" id="resetBtn">重新抽签</button></footer>
</div></div>
<script>
const design=document.getElementById('design');function fitDesign(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);design.style.transform='scale('+s+')'}window.addEventListener('resize',fitDesign);fitDesign();
const teams=["A队","B队","C队","D队","E队","F队"];
const poolWrap=document.getElementById('poolWrap'), ballEls=[...document.querySelectorAll('.ball')], mainBtn=document.getElementById('mainBtn'), statusEl=document.getElementById('status'), hint=document.getElementById('hint'), controlArea=document.getElementById('controlArea'), resultPanel=document.getElementById('resultPanel'), resultGrid=document.getElementById('resultGrid');
let balls=[],running=false,locked=false,rafId=null,lastT=0;function initBalls(){const R=250;balls=ballEls.map((el,i)=>{const size=88,orbit=153,angle=Math.PI*2/ballEls.length*i-Math.PI/2,x=R+Math.cos(angle)*orbit-size/2,y=R+Math.sin(angle)*orbit-size/2;el.style.left=x+'px';el.style.top=y+'px';el.style.transform='none';el.style.opacity='1';return{el,x,y,vx:0,vy:0,size}})}
function rnd(min,max){return min+Math.random()*(max-min)}function energize(){balls.forEach(b=>{const a=rnd(0,Math.PI*2),speed=rnd(470,650);b.vx=Math.cos(a)*speed;b.vy=Math.sin(a)*speed})}
function wall(b){const R=250,cx=b.x+b.size/2,cy=b.y+b.size/2,dx=cx-R,dy=cy-R,d=Math.hypot(dx,dy)||.001,max=R-b.size/2-7;if(d>max){const nx=dx/d,ny=dy/d,p=d-max;b.x-=nx*p;b.y-=ny*p;const dot=b.vx*nx+b.vy*ny;if(dot>0){b.vx-=1.93*dot*nx;b.vy-=1.93*dot*ny}}}
function collide(){for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],ax=a.x+a.size/2,ay=a.y+a.size/2,bx=b.x+b.size/2,by=b.y+b.size/2;let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy)||.001,min=(a.size+b.size)/2+2;if(d<min){const nx=dx/d,ny=dy/d,o=min-d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rel=rvx*nx+rvy*ny;if(rel<0){const imp=-1.82*rel/2,ix=imp*nx,iy=imp*ny;a.vx-=ix;a.vy-=iy;b.vx+=ix;b.vy+=iy}}}}
function tick(t){if(!running)return;if(!lastT)lastT=t;const dt=Math.min((t-lastT)/1000,.020);lastT=t;const c=250;balls.forEach(b=>{const cx=b.x+b.size/2,cy=b.y+b.size/2,dx=cx-c,dy=cy-c,d=Math.hypot(dx,dy)||1;b.vx+=(-dy/d)*125*dt;b.vy+=(dx/d)*125*dt;b.vx*=.99935;b.vy*=.99935;b.x+=b.vx*dt;b.y+=b.vy*dt;wall(b)});collide();balls.forEach(b=>{b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';b.el.style.transform='rotate('+((b.x+b.y)*.60)+'deg)'});rafId=requestAnimationFrame(tick)}
function secureRandomInt(max){const limit=Math.floor(0x100000000/max)*max,arr=new Uint32Array(1);do{crypto.getRandomValues(arr)}while(arr[0]>=limit);return arr[0]%max}function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=secureRandomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function ballColor(team){const idx=teams.indexOf(team)+1;return getComputedStyle(document.documentElement).getPropertyValue('--ball'+idx).trim()}
function startDraw(){running=true;lastT=0;energize();mainBtn.classList.remove('ready');mainBtn.textContent='⏹ 停止并生成顺序';statusEl.textContent='抽签进行中…';hint.textContent='六支队伍正在高速随机滚动，再次点击即可立即生成完整汇报顺序';rafId=requestAnimationFrame(tick)}
function renderResult(order){resultGrid.innerHTML='';order.forEach((team,i)=>{const row=document.createElement('div');row.className='rank';row.style.animationDelay=(i*.11)+'s';row.innerHTML='<div class="rank-no">'+String(i+1).padStart(2,'0')+'</div><div class="rank-ball" style="background:'+ballColor(team)+'">'+team.replace('队','')+'</div><div class="rank-name">'+team+'</div>';resultGrid.appendChild(row);requestAnimationFrame(()=>row.classList.add('in'))})}
function stopDraw(){running=false;locked=true;cancelAnimationFrame(rafId);const order=shuffle(teams);statusEl.textContent='抽签完成｜结果已锁定';poolWrap.style.opacity='0';poolWrap.style.transform='translateX(-50%) scale(.965)';controlArea.style.opacity='0';renderResult(order);setTimeout(()=>resultPanel.classList.add('show'),160)}
mainBtn.addEventListener('click',()=>{if(locked)return;running?stopDraw():startDraw()});document.getElementById('resetBtn').addEventListener('click',()=>{if(!locked&&!running)return;if(!confirm('确定重新抽签吗？当前抽签结果将被清除。'))return;running=false;locked=false;cancelAnimationFrame(rafId);resultPanel.classList.remove('show');resultGrid.innerHTML='';poolWrap.style.opacity='1';poolWrap.style.transform='translateX(-50%) scale(1)';controlArea.style.opacity='1';mainBtn.textContent='🎲 开始抽签';mainBtn.classList.add('ready');statusEl.textContent='6支参赛队伍｜完整排序';hint.textContent='点击“开始抽签”后六个队伍球同时滚动；再次点击即停止并生成 1—6 名完整顺序';initBalls()});initBalls();
</script>
</body>
</html>
