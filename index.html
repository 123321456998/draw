<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>党建引领AI业务大赛｜现场汇报顺序抽签</title>
<style>
:root{
  --paper:#F7F5EF;
  --blue:#163A5F;
  --blue-2:#1F4D7A;
  --muted:#6B7C8F;
  --red:#B82025;
  --red-2:#D43A3F;
  --gold:#B9964A;
  --line:rgba(22,58,95,.18);
  --glass:rgba(255,255,255,.78);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  background:var(--paper);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;
  color:var(--blue);
}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.design{
  position:absolute;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:
    radial-gradient(circle at 50% -8%,rgba(198,40,40,.07),transparent 24%),
    radial-gradient(circle at 50% 108%,rgba(23,58,94,.06),transparent 24%),
    var(--paper);
}
.design::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.035;
  background-image:linear-gradient(rgba(23,58,94,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(23,58,94,.7) 1px,transparent 1px);
  background-size:96px 96px;
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
}
.tech-lines{display:none}
.topbar{
  position:absolute;left:64px;right:64px;top:34px;height:48px;
  display:flex;align-items:center;justify-content:space-between;z-index:3;
}
.brand,.status-pill{
  height:48px;border-radius:999px;border:1px solid rgba(255,255,255,.82);
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
  box-shadow:0 12px 30px rgba(22,58,95,.08);
  display:flex;align-items:center;color:var(--blue);
}
.brand{width:220px;justify-content:center;gap:10px;font-size:16px;font-weight:900;letter-spacing:.4px}
.live-dot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(184,32,37,.11)}
.status-pill{padding:0 22px;font-size:18px;font-weight:850;color:#405A73}
.hero{
  position:absolute;left:50%;top:126px;width:1180px;transform:translateX(-50%);
  text-align:center;z-index:2;
}
.event-tag{
  display:inline-flex;align-items:center;height:36px;padding:0 20px;border-radius:999px;
  background:linear-gradient(90deg,var(--red),#C92C31);color:#fff;font-size:19px;font-weight:900;
  letter-spacing:2px;box-shadow:0 10px 24px rgba(184,32,37,.18);
}
.hero h1{margin:16px 0 0;font-size:56px;line-height:1.08;font-weight:950;letter-spacing:.5px;color:var(--blue)}
.hero p{margin:14px 0 0;color:var(--muted);font-size:24px;line-height:1.35;font-weight:760}
.stage{
  position:absolute;left:50%;top:252px;width:720px;height:720px;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.stage.running::before{
  content:"";position:absolute;inset:-90px;border-radius:50%;opacity:.72;
  background:conic-gradient(from 0deg,transparent,rgba(184,32,37,.08),transparent,rgba(22,58,95,.10),transparent);
  animation:haloSpin 8s linear infinite;
}
@keyframes haloSpin{to{transform:rotate(360deg)}}
.pool-wrap{position:relative;width:660px;height:660px;transition:opacity .28s ease,transform .34s ease}
.pool{
  position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:2px solid rgba(22,58,95,.72);
  background:
    radial-gradient(circle at 50% 44%,rgba(255,255,255,.94),rgba(255,255,255,.72) 48%,rgba(255,255,255,.50) 100%),
    linear-gradient(135deg,rgba(255,255,255,.86),rgba(230,239,247,.62));
  box-shadow:
    inset 0 0 0 12px rgba(255,255,255,.52),
    inset 0 0 70px rgba(22,58,95,.09),
    0 28px 70px rgba(22,58,95,.16);
}
.pool::before{
  content:"";position:absolute;inset:34px;border-radius:50%;border:1px dashed rgba(22,58,95,.18);
}
.pool-center{
  position:absolute;left:50%;top:50%;width:220px;height:220px;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(185,150,74,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(247,245,239,.72));
  display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;
  box-shadow:0 16px 32px rgba(22,58,95,.08),inset 0 0 0 8px rgba(255,255,255,.48);
}
.center-kicker{display:block;color:var(--muted);font-size:28px;font-weight:850;letter-spacing:1px}
.center-count{display:none}
.center-final{display:none}
.center-final strong{display:block;color:var(--red);font-size:30px;font-weight:950;letter-spacing:1px}
.center-final span{display:block;margin-top:8px;color:var(--blue);font-size:52px;font-weight:950}
.running .center-kicker{color:var(--blue)}
.running .center-count{display:block;animation:countPulse 1s ease-in-out infinite}
@keyframes countPulse{0%,100%{transform:scale(.94);opacity:.72}50%{transform:scale(1.08);opacity:1}}
.ball{
  position:absolute;width:102px;height:102px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:27px;font-weight:950;background:var(--blue);
  border:2px solid rgba(255,255,255,.92);
  box-shadow:0 14px 26px rgba(22,58,95,.24),inset 0 0 0 5px rgba(255,255,255,.08);
  user-select:none;will-change:left,top,transform,background,box-shadow;
}
.ball::after{
  content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
}
.running .ball{
  background:linear-gradient(145deg,var(--blue),#245985);
  box-shadow:0 16px 34px rgba(22,58,95,.28),0 0 0 5px rgba(185,150,74,.12),inset 0 0 0 5px rgba(255,255,255,.08);
}
.running .ball:nth-child(2n){background:linear-gradient(145deg,#20486E,var(--gold))}
.control-area{
  position:absolute;left:50%;top:928px;width:760px;transform:translateX(-50%);
  text-align:center;transition:opacity .28s ease;z-index:3;
}
.main-btn{
  width:420px;height:72px;border-radius:18px;border:0;cursor:pointer;
  background:var(--red);color:#fff;
  font-size:30px;font-weight:950;letter-spacing:2px;
  box-shadow:0 16px 34px rgba(184,32,37,.22),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
.main-btn:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(184,32,37,.30),0 0 0 8px rgba(184,32,37,.08)}
.main-btn.ready{animation:buttonGlow 2s ease-in-out infinite}
@keyframes buttonGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}
.hint{
  margin:18px auto 0;min-height:48px;display:flex;align-items:center;justify-content:center;
  border-top:1px solid rgba(22,58,95,.10);border-bottom:1px solid rgba(22,58,95,.10);
  color:#65788A;font-size:20px;line-height:1.45;font-weight:760;white-space:nowrap;
  background:rgba(255,255,255,.34);
}
.footer{
  position:absolute;left:64px;right:64px;bottom:28px;height:34px;display:flex;align-items:center;justify-content:space-between;
  color:#7D8C9A;font-size:19px;font-weight:760;z-index:3;
}
.reset-btn{
  padding:7px 14px;border:1px solid rgba(22,58,95,.22);border-radius:10px;
  background:rgba(255,255,255,.55);color:#526D86;font-size:14px;font-weight:850;cursor:pointer;
}
.result-panel{
  position:absolute;left:50%;top:232px;width:980px;transform:translateX(-50%) translateY(16px) scale(.99);
  opacity:0;pointer-events:none;transition:.38s ease;z-index:4;
}
.result-panel.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.result-card{
  width:100%;padding:28px 36px 26px;border:1px solid rgba(22,58,95,.16);border-radius:22px;
  background:rgba(255,255,255,.91);backdrop-filter:blur(16px);
  box-shadow:0 28px 72px rgba(22,58,95,.17);
}
.result-head{text-align:center;margin-bottom:24px}
.result-head h2{margin:0;font-size:40px;font-weight:950;color:var(--blue);letter-spacing:2px}
.result-head p{margin:10px 0 0;color:var(--muted);font-size:20px;font-weight:760}
.result-grid{display:grid;grid-template-columns:1fr;gap:10px}
.rank{
  min-height:80px;display:flex;align-items:center;gap:22px;padding:12px 22px;
  border:1px solid rgba(22,58,95,.14);border-radius:18px;background:linear-gradient(90deg,rgba(247,245,239,.88),rgba(255,255,255,.94));
  opacity:0;transform:translateY(12px);position:relative;overflow:hidden;
}
.rank::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--red),var(--gold))}
.rank.in{animation:rankIn .42s ease forwards}
@keyframes rankIn{to{opacity:1;transform:none}}
.rank-no{
  width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;
  color:#fff;background:linear-gradient(145deg,var(--red),#8F151A);font-size:18px;font-weight:950;
}
.rank-ball{
  width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  color:#fff;background:var(--blue);border:2px solid rgba(255,255,255,.92);font-size:15px;font-weight:950;
}
.rank-name{font-size:27px;font-weight:950;color:var(--blue)}
.rank::after{content:"汇报顺序已生成";margin-left:auto;color:#7D8C9A;font-size:18px;font-weight:800}
.lock{
  width:max-content;margin:24px auto 0;padding:10px 18px;border-radius:999px;
  background:rgba(184,32,37,.08);border:1px solid rgba(184,32,37,.18);color:#9D2024;font-size:16px;font-weight:900;
}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.particle{
  position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:0;
  animation:particleRise 1.45s ease-out forwards;
}
@keyframes particleRise{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  16%{opacity:.75}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}
}
</style>
</head>
<body>
<div class="viewport"><div class="design" id="design">
<div class="tech-lines"></div><div class="particles" id="particles"></div>
<header class="topbar"><div class="brand"><span class="live-dot"></span><span>LIVE DRAW</span></div><div class="status-pill" id="status">6支参赛队伍 | 完整排序</div></header>
<section class="hero"><div class="event-tag">党建引领AI业务大赛</div><h1>现场汇报顺序抽签</h1><p>以党建引领业务创新，以AI赋能高质量发展</p></section>
<section class="stage" id="stage"><div class="pool-wrap" id="poolWrap"><div class="pool" id="pool"><div class="pool-center" id="poolCenter"><div><span class="center-kicker" id="centerKicker">等待开始抽签</span><span class="center-count" id="centerCount"></span><div class="center-final" id="centerFinal"><strong>汇报顺序已生成</strong><span id="firstTeam">A队</span></div></div></div><div class="ball" data-i="0">A队</div><div class="ball" data-i="1">B队</div><div class="ball" data-i="2">C队</div><div class="ball" data-i="3">D队</div><div class="ball" data-i="4">E队</div><div class="ball" data-i="5">F队</div></div></div></section>
<section class="control-area" id="controlArea"><button class="main-btn ready" id="mainBtn">开始抽签</button><div class="hint" id="hint">点击开始抽签，队伍随机滚动；再次点击生成最终汇报顺序。</div></section>
<section class="result-panel" id="resultPanel"><div class="result-card"><div class="result-head"><h2>抽签结果</h2><p>请各参赛队伍按照以下顺序进行现场汇报</p></div><div class="result-grid" id="resultGrid"></div><div class="lock">本次抽签结果已锁定</div></div></section>
<footer class="footer"><span>党建引领AI业务大赛 · 现场汇报顺序抽签</span><button class="reset-btn" id="resetBtn">重新抽签</button></footer>
</div></div>
<script>
const design=document.getElementById('design');function fitDesign(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);design.style.transform='scale('+s+')'}window.addEventListener('resize',fitDesign);fitDesign();
const teams=["A队","B队","C队","D队","E队","F队"];
const stage=document.getElementById('stage'),poolWrap=document.getElementById('poolWrap'),ballEls=[...document.querySelectorAll('.ball')],mainBtn=document.getElementById('mainBtn'),statusEl=document.getElementById('status'),hint=document.getElementById('hint'),controlArea=document.getElementById('controlArea'),resultPanel=document.getElementById('resultPanel'),resultGrid=document.getElementById('resultGrid'),centerKicker=document.getElementById('centerKicker'),centerCount=document.getElementById('centerCount'),centerFinal=document.getElementById('centerFinal'),firstTeam=document.getElementById('firstTeam'),particles=document.getElementById('particles');
let balls=[],running=false,locked=false,rafId=null,lastT=0;function initBalls(){const R=330;balls=ballEls.map((el,i)=>{const size=102,orbit=215,angle=Math.PI*2/ballEls.length*i-Math.PI/2,x=R+Math.cos(angle)*orbit-size/2,y=R+Math.sin(angle)*orbit-size/2;el.style.left=x+'px';el.style.top=y+'px';el.style.transform='none';el.style.opacity='1';return{el,x,y,vx:0,vy:0,size}})}
function rnd(min,max){return min+Math.random()*(max-min)}function energize(){balls.forEach(b=>{const a=rnd(0,Math.PI*2),speed=rnd(510,700);b.vx=Math.cos(a)*speed;b.vy=Math.sin(a)*speed})}
function wall(b){const R=330,cx=b.x+b.size/2,cy=b.y+b.size/2,dx=cx-R,dy=cy-R,d=Math.hypot(dx,dy)||.001,max=R-b.size/2-9;if(d>max){const nx=dx/d,ny=dy/d,p=d-max;b.x-=nx*p;b.y-=ny*p;const dot=b.vx*nx+b.vy*ny;if(dot>0){b.vx-=1.93*dot*nx;b.vy-=1.93*dot*ny}}}
function collide(){for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],ax=a.x+a.size/2,ay=a.y+a.size/2,bx=b.x+b.size/2,by=b.y+b.size/2;let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy)||.001,min=(a.size+b.size)/2+2;if(d<min){const nx=dx/d,ny=dy/d,o=min-d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rel=rvx*nx+rvy*ny;if(rel<0){const imp=-1.82*rel/2,ix=imp*nx,iy=imp*ny;a.vx-=ix;a.vy-=iy;b.vx+=ix;b.vy+=iy}}}}
function tick(t){if(!running)return;if(!lastT)lastT=t;const dt=Math.min((t-lastT)/1000,.020);lastT=t;const c=330;balls.forEach(b=>{const cx=b.x+b.size/2,cy=b.y+b.size/2,dx=cx-c,dy=cy-c,d=Math.hypot(dx,dy)||1;b.vx+=(-dy/d)*128*dt;b.vy+=(dx/d)*128*dt;b.vx*=.99935;b.vy*=.99935;b.x+=b.vx*dt;b.y+=b.vy*dt;wall(b)});collide();balls.forEach(b=>{b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';b.el.style.transform='rotate('+((b.x+b.y)*.54)+'deg)'});rafId=requestAnimationFrame(tick)}
function secureRandomInt(max){const limit=Math.floor(0x100000000/max)*max,arr=new Uint32Array(1);do{crypto.getRandomValues(arr)}while(arr[0]>=limit);return arr[0]%max}function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=secureRandomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function ballColor(){return getComputedStyle(document.documentElement).getPropertyValue('--blue').trim()}
function stopCounter(){}
function burstParticles(){particles.innerHTML='';for(let i=0;i<44;i++){const p=document.createElement('span');p.className='particle';p.style.left=(960+rnd(-170,170))+'px';p.style.top=(535+rnd(-90,80))+'px';p.style.setProperty('--dx',rnd(-260,260)+'px');p.style.setProperty('--dy',rnd(-240,170)+'px');p.style.animationDelay=rnd(0,.28)+'s';p.style.background=i%3===0?'var(--red)':'var(--gold)';particles.appendChild(p)}setTimeout(()=>particles.innerHTML='',1900)}
function startDraw(){running=true;lastT=0;energize();stage.classList.add('running');mainBtn.classList.remove('ready');mainBtn.textContent='生成汇报顺序';statusEl.textContent='抽签进行中';hint.textContent='正在随机生成汇报顺序；再次点击生成最终结果。';centerKicker.textContent='抽签进行中';centerKicker.style.display='block';centerCount.style.display='none';centerFinal.style.display='none';rafId=requestAnimationFrame(tick)}
function renderResult(order){resultGrid.innerHTML='';order.forEach((team,i)=>{const row=document.createElement('div');row.className='rank';row.style.animationDelay=(i*.11)+'s';row.innerHTML='<div class="rank-no">'+String(i+1).padStart(2,'0')+'</div><div class="rank-ball" style="background:'+ballColor()+'">'+team.replace('队','')+'</div><div class="rank-name">'+team+'</div>';resultGrid.appendChild(row);requestAnimationFrame(()=>row.classList.add('in'))})}
function stopDraw(){running=false;locked=true;cancelAnimationFrame(rafId);stopCounter();const order=shuffle(teams);statusEl.textContent='抽签完成 | 结果已锁定';firstTeam.textContent=order[0];centerKicker.style.display='none';centerCount.style.display='none';centerFinal.style.display='block';stage.classList.remove('running');poolWrap.style.opacity='0';poolWrap.style.transform='scale(.965)';controlArea.style.opacity='0';renderResult(order);burstParticles();setTimeout(()=>resultPanel.classList.add('show'),160)}
mainBtn.addEventListener('click',()=>{if(locked)return;running?stopDraw():startDraw()});document.getElementById('resetBtn').addEventListener('click',()=>{if(!locked&&!running)return;if(!confirm('确定重新抽签吗？当前抽签结果将被清除。'))return;running=false;locked=false;cancelAnimationFrame(rafId);stopCounter();resultPanel.classList.remove('show');resultGrid.innerHTML='';poolWrap.style.opacity='1';poolWrap.style.transform='scale(1)';controlArea.style.opacity='1';stage.classList.remove('running');mainBtn.textContent='开始抽签';mainBtn.classList.add('ready');statusEl.textContent='6支参赛队伍 | 完整排序';hint.textContent='点击开始抽签，6支队伍随机滚动；再次点击停止并生成最终汇报顺序。';centerKicker.style.display='block';centerKicker.textContent='等待开始抽签';centerCount.style.display='none';centerFinal.style.display='none';particles.innerHTML='';initBalls()});initBalls();
</script>
</body>
</html>
